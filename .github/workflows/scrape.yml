name: Scrape cinemas

# Manual scrape of all cinema providers against the production Turso DB.
#
# Daily cron was DISABLED on 2026-04-23 because GitHub Actions runner IPs
# get HTTP 403 from lumiton.ar (Cloudflare) and complejoteatral.gob.ar
# (datacenter-IP reputation heuristics). Only MALBA succeeds from runner
# IPs; the other 4 providers fail silently. Running from a residential
# IP works — use `npm run scrape:prod` from the dev machine instead,
# which is the currently supported path.
#
# This workflow is kept around with manual trigger only (workflow_dispatch)
# so we can re-enable it cheaply if we ever put a proxy (CF Worker /
# Vercel Edge / paid residential) in front of the scraper.
#
# After a successful scrape we POST the site's revalidate webhook so the
# week-view Server Component re-renders against fresh data on the next visit.

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run scraper against Turso
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: npx tsx src/scrapers/run.ts

      - name: Revalidate week-view cache
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "X-Revalidate-Secret: $REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate"
